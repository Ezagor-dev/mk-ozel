<style>
*,*::before,*::after{box-sizing:border-box}html,body{margin:0;height:100%}body{font:15px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#0a2147}
.oz-locked{position:fixed;inset:0;background:#0a2147;overflow:hidden}
.oz-locked-bg span{position:absolute;border-radius:50%;filter:blur(60px);opacity:.55;animation:oz-drift 14s ease-in-out infinite alternate}
.oz-locked-bg span:nth-child(1){width:520px;height:520px;left:-120px;top:-140px;background:#1d5fb8}
.oz-locked-bg span:nth-child(2){width:420px;height:420px;right:-100px;bottom:-120px;background:#f5b335;opacity:.25;animation-duration:18s}
.oz-locked-bg span:nth-child(3){width:360px;height:360px;left:45%;top:55%;background:#2a78d6;opacity:.3;animation-duration:22s}
@keyframes oz-drift{to{transform:translate(60px,40px) scale(1.1)}}
.oz-gate input,.oz-gate button{font-family:inherit}
/* Password popup for /ozel, opened from the landing page footer or the page itself.
   Navy glass over a blurred page; the lock opens on success. Classes are oz- prefixed. */

.oz-gate .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.oz-gate {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 16px;
  background: rgba(6, 18, 40, 0.55);
  backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
  animation: oz-fade 0.35s ease-out both;
}
.oz-gate-glow {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(40% 45% at 50% 42%, rgba(42, 120, 214, 0.35), transparent 70%),
    radial-gradient(30% 30% at 62% 62%, rgba(245, 179, 53, 0.16), transparent 70%);
  animation: oz-breathe 6s ease-in-out infinite;
}

.oz-card {
  position: relative; width: min(400px, 100%); padding: 34px 30px 28px; border-radius: 24px; text-align: center; color: #fff;
  background: linear-gradient(160deg, rgba(20, 52, 104, 0.92), rgba(10, 33, 71, 0.96));
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  animation: oz-pop 0.55s cubic-bezier(0.2, 0.9, 0.25, 1.15) both;
  isolation: isolate;
}
/* Slowly turning light on the card's edge. */
.oz-ring {
  position: absolute; inset: -1px; border-radius: inherit; padding: 1px; z-index: -1; pointer-events: none;
  background: conic-gradient(from var(--oz-a, 0deg), transparent 0 70%, rgba(245, 179, 53, 0.9) 80%, rgba(42, 120, 214, 0.9) 90%, transparent);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask-composite: exclude;
  animation: oz-turn 5s linear infinite;
}
@property --oz-a { syntax: '<angle>'; inherits: false; initial-value: 0deg; }

.oz-x {
  position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 10px; border: 0; cursor: pointer;
  display: grid; place-items: center; background: rgba(255, 255, 255, 0.06); color: rgba(255, 255, 255, 0.7);
  transition: background 0.15s, color 0.15s;
}
.oz-x:hover { background: rgba(255, 255, 255, 0.14); color: #fff; }
.oz-x svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

.oz-lock { position: relative; width: 76px; height: 76px; margin: 0 auto 14px; display: grid; place-items: center;
  border-radius: 22px; background: radial-gradient(circle at 50% 35%, rgba(245, 179, 53, 0.22), rgba(245, 179, 53, 0.05));
  box-shadow: inset 0 0 0 1px rgba(245, 179, 53, 0.25); animation: oz-float 3.6s ease-in-out infinite; }
.oz-lock svg { width: 46px; height: 46px; overflow: visible; }
.oz-shackle { fill: none; stroke: #f5b335; stroke-width: 5; stroke-linecap: round; transform-origin: 44px 29px; transition: transform 0.55s cubic-bezier(0.3, 1.4, 0.4, 1); }
.oz-body { fill: #f5b335; transition: fill 0.4s; }
.oz-hole { fill: #0a2147; stroke: #0a2147; stroke-width: 3; stroke-linecap: round; }
.oz-burst { position: absolute; inset: 0; border-radius: 22px; pointer-events: none; }

.oz-kicker { font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #f5b335; }
.oz-card h2 { margin: 6px 0 4px; font-size: 26px; letter-spacing: -0.02em; font-weight: 700; }
.oz-sub { margin: 0 0 22px; color: rgba(255, 255, 255, 0.68); font-size: 14px; }

.oz-field { position: relative; display: block; }
.oz-field input {
  width: 100%; height: 52px; padding: 0 48px 0 18px; border-radius: 14px; font: inherit; font-size: 16px; letter-spacing: 0.04em; color: #fff;
  background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.16); outline: none;
  transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
}
.oz-field input::placeholder { color: rgba(255, 255, 255, 0.45); letter-spacing: 0; }
.oz-field input:focus { border-color: #f5b335; background: rgba(255, 255, 255, 0.1); box-shadow: 0 0 0 4px rgba(245, 179, 53, 0.18); }
.oz-field input[aria-invalid='true'] { border-color: #ff7a6b; box-shadow: 0 0 0 4px rgba(255, 122, 107, 0.16); }
.oz-eye { position: absolute; right: 8px; top: 8px; width: 36px; height: 36px; border: 0; border-radius: 10px; cursor: pointer; display: grid; place-items: center; background: transparent; color: rgba(255, 255, 255, 0.6); }
.oz-eye:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
.oz-eye svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

.oz-err { min-height: 20px; margin: 8px 0 6px; font-size: 13.5px; color: #ff9d92; }
.oz-go {
  width: 100%; height: 50px; border: 0; border-radius: 14px; cursor: pointer; font: inherit; font-weight: 700; font-size: 15.5px;
  display: grid; place-items: center; color: #0a2147; background: linear-gradient(180deg, #ffc65a, #f5b335);
  box-shadow: 0 10px 26px -8px rgba(245, 179, 53, 0.6); transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
}
.oz-go:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -8px rgba(245, 179, 53, 0.7); }
.oz-go:disabled { cursor: progress; transform: none; filter: saturate(0.85); }
.oz-spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(10, 33, 71, 0.25); border-top-color: #0a2147; animation: oz-rot 0.7s linear infinite; }

/* Wrong password: the card shakes, the lock wiggles. */
.oz-gate.shake .oz-card { animation: oz-shake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both; }
.oz-gate.shake .oz-shackle { transform: rotate(-8deg); }
/* Right password: the shackle lifts and swings open, the lock turns green, light bursts out, the card zooms through. */
.oz-gate.opening .oz-shackle { transform: translateY(-7px) rotate(-38deg); }
.oz-gate.opening .oz-body { fill: #3ddc97; }
.oz-gate.opening .oz-burst { animation: oz-burst 0.8s ease-out 0.2s both; }
.oz-gate.opening .oz-card { animation: oz-through 0.55s cubic-bezier(0.6, 0, 0.8, 0.4) 0.6s both; }
.oz-gate.opening { animation: oz-out 0.4s ease-in 0.75s both; }

@keyframes oz-fade { from { opacity: 0; } }
@keyframes oz-pop { from { opacity: 0; transform: translateY(18px) scale(0.92); } }
@keyframes oz-turn { to { --oz-a: 360deg; } }
@keyframes oz-breathe { 50% { opacity: 0.65; transform: scale(1.06); } }
@keyframes oz-float { 50% { transform: translateY(-4px); } }
@keyframes oz-rot { to { transform: rotate(360deg); } }
@keyframes oz-shake { 10%, 90% { transform: translateX(-2px); } 20%, 80% { transform: translateX(5px); } 30%, 50%, 70% { transform: translateX(-9px); } 40%, 60% { transform: translateX(9px); } }
@keyframes oz-burst { from { box-shadow: 0 0 0 0 rgba(61, 220, 151, 0.7); } to { box-shadow: 0 0 0 46px rgba(61, 220, 151, 0); } }
@keyframes oz-through { to { opacity: 0; transform: scale(1.12); filter: blur(4px); } }
@keyframes oz-out { to { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  .oz-gate, .oz-card, .oz-ring, .oz-gate-glow, .oz-lock, .oz-gate.shake .oz-card, .oz-gate.opening .oz-card, .oz-gate.opening .oz-burst { animation: none !important; }
  .oz-shackle { transition: none; }
}

</style></head>

    <div class="oz-kicker">Özel alan</div>

  </form>
</div></div>

function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0);});}
function show(html){document.open();document.write(html);document.close();}
async function open_(raw){var k=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},k,b64(P.c));return new TextDecoder().decode(pt);}
(async function(){try{var saved=sessionStorage.getItem('mk-ozel-key');if(saved){window.__ozKey=b64(saved);show(await open_(b64(saved)));return;}}catch(e){}})();
var gate=document.getElementById('gate'),f=document.getElementById('f'),pw=document.getElementById('pw'),err=document.getElementById('err'),go=document.getElementById('go');
document.getElementById('eye').onclick=function(){pw.type=pw.type==='password'?'text':'password';};
f.onsubmit=async function(e){e.preventDefault();if(!pw.value)return;go.disabled=true;go.innerHTML='<span class="oz-spin" aria-hidden="true"></span>';err.textContent='';
  try{var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw.value),'PBKDF2',false,['deriveBits']);
    var raw=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:b64(P.s),iterations:P.n},base,256));
    var html=await open_(raw);
    try{sessionStorage.setItem('mk-ozel-key',btoa(String.fromCharCode.apply(null,raw)));}catch(e){}
    window.__ozKey=raw;
    gate.classList.add('opening');go.textContent='Açılıyor…';setTimeout(function(){show(html);},1100);
  }catch(x){gate.classList.add('shake');err.textContent='Şifre hatalı.';pw.setAttribute('aria-invalid','true');pw.select();
    go.disabled=false;go.textContent='Kilidi aç';setTimeout(function(){gate.classList.remove('shake');},520);}
};
</script>
